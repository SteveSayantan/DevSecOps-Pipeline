name: backend-ci
on:
  workflow_dispatch:

jobs:
  
  build:
    runs-on: ubuntu-latest
    environment: QA
    permissions:
      id-token: write
    services:
      redis:
        image: 'redis:alpine3.22'
        options:
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 7s
        ports:
          - 6379:6379
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.DB_ROOT_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASS }}
        options: >-
          --health-cmd "mongosh --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 30s
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # caches npm’s global cache directory between workflow runs, enabling npm to retrieve package archives from the restored cache 
          # instead of downloading everything from the registry again in the subsequent workflow runs as every new runner starts with an empty npm cache 
          # This speeds up the installation of dependencies and reduces network traffic
          # But it does not cache the node_modules directory
          cache: 'npm'
          # specifies the dependency file determining the cache key.
          # When the lockfile changes, the cache key changes and GitHub Actions creates a new cache. 
          # This prevents dependencies from one lockfile version being incorrectly reused for another.
          cache-dependency-path: backend/package-lock.json

          # There is another property called `package-manager-cache`. It is useful when when the root package.json declares a package manager (e.g., npm). In that case we don't need to specify `cache: npm` explicitly, as the detection of the package manager and caching will be handled automatically.

      - name: Install Dependencies
        run: npm ci --prefix=backend/

      - name: Run Dependency Scan
        run: npm audit --omit=dev --audit-level=high --prefix=backend/

      - name: 🍃 Install mongosh
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq mongodb-mongosh
        
      - name: Create Test Database and Restricted User
        env:
          ROOT_MONGO_USER: ${{ vars.DB_ROOT_USER }}
          ROOT_MONGO_PASS: ${{ secrets.DB_ROOT_PASS }}
          APP_MONGO_USER: ${{ vars.DB_APP_USER }}
          APP_MONGO_PASS: ${{ secrets.DB_APP_PASS }}
          APP_MONGO_DB: ${{ vars.DB_APP_NAME }}
        run: |
          mongosh "mongodb://$ROOT_MONGO_USER:$ROOT_MONGO_PASS@localhost:27017/admin" --eval '
            const appDbName = process.env.APP_MONGO_DB;
            const testDb = db.getSiblingDB(appDbName);
            testDb.createUser({
              user: process.env.APP_MONGO_USER,
              pwd: process.env.APP_MONGO_PASS,
              roles: [{ role: "readWrite", db: appDbName }]
            });'

      - name: Run Tests with Coverage
        run: npm run test:ci --prefix=backend/
        env:
          REDIS_HOST: localhost
          MONGO_HOST: localhost
          APP_MONGO_USER: ${{ vars.DB_APP_USER }}
          APP_MONGO_PASS: ${{ secrets.DB_APP_PASS }}
          APP_MONGO_DB: ${{ vars.DB_APP_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          ACCESS_COOKIE_MAXAGE: ${{ vars.ACCESS_COOKIE_MAXAGE }}
          ACCESS_TOKEN_EXPIRES_IN: ${{ vars.ACCESS_TOKEN_EXPIRES_IN }}
          REFRESH_COOKIE_MAXAGE: ${{ vars.REFRESH_COOKIE_MAXAGE }}
          REFRESH_TOKEN_EXPIRES_IN: ${{ vars.REFRESH_TOKEN_EXPIRES_IN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report-${{ github.run_number }}
          path: backend/coverage
          if-no-files-found: error

      - name: Build
        run: npm run build --prefix=backend/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.ECR_PUSH_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Log in to ECR
        # Once the job is over, this action will log out from the registry automatically as the `logout` input is set to `true` by default.
        uses: docker/login-action@v4
        with:
          # This is the URL of the Amazon ECR registry (e.g., `992234941893.dkr.ecr.us-east-1.amazonaws.com`), not the name of the repository
          registry: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # This action determines which tags and labels should be assigned to the Docker image
        uses: docker/metadata-action@v6
        with:
          # This is the base name of the image to be built and pushed
          images: |
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_BACKEND_REPO }}
          # This is the tag to be assigned to the image. The `prefix` is set to an empty string, so the tag will be just the short SHA without any prefix (e.g., `abcd1234` instead of `sha-abcd1234`).
          tags: |
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          # Disable provenance and SBOM attestations which combinedly create metadata manifests
          # When enabled, Docker wraps the actual image and metadata manifests into an OCI Image Index,
          # causing ECR to display separate rows for each of the three components. 
          #The tag sits on the parent Image Index, the actual runnable container image and the attestation files underneath it appear as untagged rows in the UI.
          sbom: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
        env:
          # To prevent the action from uploading the build record as Github artifact
          DOCKER_BUILD_RECORD_UPLOAD: false