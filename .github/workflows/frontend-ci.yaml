name: frontend-ci
on:
  workflow_dispatch:

jobs:
  
  build:
    runs-on: ubuntu-latest
    environment: QA
    permissions:
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # caches npm’s global cache directory between workflow runs, enabling npm to retrieve package archives from the restored cache 
          # instead of downloading everything from the registry again in the subsequent workflow runs as every new runner starts with an empty npm cache 
          # This speeds up the installation of dependencies and reduces network traffic
          # But it does not cache the node_modules directory
          cache: 'npm'
          # specifies the dependency file determining the cache key.
          # When the lockfile changes, the cache key changes and GitHub Actions creates a new cache. 
          # This prevents dependencies from one lockfile version being incorrectly reused for another.
          cache-dependency-path: frontend/package-lock.json

          # There is another property called `package-manager-cache`. It is useful when when the root package.json declares a package manager (e.g., npm). In that case we don't need to specify `cache: npm` explicitly, as the detection of the package manager and caching will be handled automatically.

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --prefix=frontend/

      - name: Run Dependency Scan
        run: npm audit --omit=dev --audit-level=high --prefix=frontend/

      - name: Run Tests with Coverage
        run: npm run coverage --prefix=frontend/

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report-${{ github.run_number }}
          path: frontend/coverage
          if-no-files-found: error

      - name: Build
        run: npm run build --prefix=frontend/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.ECR_PUSH_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        # Once the job is over, this action will log out from the registry automatically as the `logout` input is set to `true` by default.
        uses: docker/login-action@v4
        with:
          # This is the URL of the Amazon ECR registry (e.g., `992234941893.dkr.ecr.us-east-1.amazonaws.com`), not the name of the repository
          registry: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # This action determines which tags and labels should be assigned to the Docker image
        uses: docker/metadata-action@v6
        with:
          # This is the base name of the image to be built and pushed
          images: |
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_FRONTEND_REPO }}
          # This is the tag to be assigned to the image. The `prefix` is set to an empty string, so the tag will be just the short SHA without any prefix (e.g., `abcd1234` instead of `sha-abcd1234`).
          tags: |
            type=sha,prefix=
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          # Disable provenance and SBOM attestations which combinedly create metadata manifests
          # When enabled, Docker wraps the actual image and metadata manifests into an OCI Image Index,
          # causing ECR to display separate rows for each of the three components. 
          #The tag sits on the parent Image Index, the actual runnable container image and the attestation files underneath it appear as untagged rows in the UI.
          sbom: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
        env:
          # To prevent the action from uploading the build record as Github artifact
          DOCKER_BUILD_RECORD_UPLOAD: false
      